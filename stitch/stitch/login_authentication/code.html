<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | The Editorial Enterprise</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-secondary-container": "#57657a",
                        "tertiary": "#003e29",
                        "secondary-container": "#d5e3fc",
                        "secondary-fixed-dim": "#b9c7df",
                        "error-container": "#ffdad6",
                        "background": "#faf8ff",
                        "surface-container-highest": "#dae2fd",
                        "on-primary": "#ffffff",
                        "on-primary-container": "#acb9ff",
                        "surface-container-high": "#e2e7ff",
                        "tertiary-fixed-dim": "#4edea3",
                        "on-tertiary-fixed-variant": "#005236",
                        "on-secondary-fixed-variant": "#3a485b",
                        "inverse-surface": "#283044",
                        "inverse-primary": "#b9c3ff",
                        "on-secondary-fixed": "#0d1c2e",
                        "surface-container-lowest": "#ffffff",
                        "surface-variant": "#dae2fd",
                        "primary-fixed-dim": "#b9c3ff",
                        "on-error": "#ffffff",
                        "surface-dim": "#d2d9f4",
                        "primary-fixed": "#dde1ff",
                        "secondary-fixed": "#d5e3fc",
                        "on-primary-fixed": "#001356",
                        "on-surface": "#131b2e",
                        "outline-variant": "#c5c5d4",
                        "surface-container": "#eaedff",
                        "on-background": "#131b2e",
                        "outline": "#757683",
                        "on-primary-fixed-variant": "#283e9a",
                        "surface-tint": "#4257b3",
                        "error": "#ba1a1a",
                        "on-tertiary-container": "#42d59a",
                        "primary": "#102b88",
                        "surface": "#faf8ff",
                        "on-secondary": "#ffffff",
                        "surface-container-low": "#f2f3ff",
                        "inverse-on-surface": "#eef0ff",
                        "on-error-container": "#93000a",
                        "primary-container": "#2e44a0",
                        "tertiary-fixed": "#6ffbbe",
                        "on-surface-variant": "#454652",
                        "tertiary-container": "#00583b",
                        "secondary": "#515f74",
                        "surface-bright": "#faf8ff",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed": "#002113"
                    },
                    fontFamily: {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
        }
        .editorial-gradient {
            background: linear-gradient(135deg, #102b88 0%, #2e44a0 100%);
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center justify-center p-6 relative overflow-hidden">
<!-- Background Texture -->
<div class="absolute inset-0 z-0 opacity-5 pointer-events-none">
<svg height="100%" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="40" id="grid" patternunits="userSpaceOnUse" width="40">
<path d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" stroke-width="1"></path>
</pattern>
</defs>
<rect fill="url(#grid)" height="100%" width="100%"></rect>
</svg>
</div>
<!-- Login Container -->
<main class="w-full max-w-[440px] z-10">
<!-- Logo Section -->
<div class="flex flex-col items-center mb-10">
<div class="w-14 h-14 editorial-gradient rounded-lg flex items-center justify-center mb-4 shadow-xl shadow-primary/20">
<span class="material-symbols-outlined text-on-primary text-3xl" data-icon="restaurant_menu">restaurant_menu</span>
</div>
<h1 class="font-headline text-2xl font-extrabold tracking-tight text-primary">The Editorial Enterprise</h1>
<p class="font-body text-sm text-on-surface-variant mt-1">SuperAdmin Portal</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl p-8 shadow-[0_32px_64px_-12px_rgba(19,27,46,0.06)] border border-outline-variant/10">
<form class="space-y-6">
<!-- Header -->
<div class="space-y-1">
<h2 class="font-headline text-xl font-bold text-on-surface">Welcome back</h2>
<p class="font-body text-sm text-on-surface-variant">Enter your credentials to access the enterprise dashboard.</p>
</div>
<!-- Input Group: Email -->
<div class="space-y-2">
<label class="font-label text-xs font-semibold text-on-surface-variant tracking-wider uppercase" for="email">Username or Email</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-lg" data-icon="alternate_email">alternate_email</span>
</div>
<input class="block w-full pl-10 pr-4 py-3 bg-surface-container-low border-0 rounded-lg text-on-surface font-body text-sm focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all duration-200 outline-none" id="email" name="email" placeholder="admin@editorial.com" required="" type="email"/>
</div>
</div>
<!-- Input Group: Password -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label text-xs font-semibold text-on-surface-variant tracking-wider uppercase" for="password">Password</label>
<a class="font-label text-xs font-bold text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-lg" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-10 pr-12 py-3 bg-surface-container-low border-0 rounded-lg text-on-surface font-body text-sm focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all duration-200 outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-lg" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary/20 bg-surface-container-low" id="remember" type="checkbox"/>
<label class="ml-2 font-body text-sm text-on-surface-variant" for="remember">Stay signed in for 30 days</label>
</div>
<!-- Submit Button -->
<button class="w-full editorial-gradient text-on-primary font-headline font-bold py-3.5 rounded-lg shadow-lg shadow-primary/20 hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-lg" data-icon="login">login</span>
</button>
</form>
</div>
<!-- Footer Actions -->
<footer class="mt-8 text-center space-y-4">
<p class="font-body text-sm text-on-surface-variant">
                Protected by enterprise-grade 256-bit encryption.
            </p>
<div class="flex items-center justify-center gap-6">
<a class="font-label text-xs text-outline hover:text-on-surface transition-colors" href="#">Security Policy</a>
<div class="w-1 h-1 bg-outline-variant rounded-full"></div>
<a class="font-label text-xs text-outline hover:text-on-surface transition-colors" href="#">Support Center</a>
</div>
</footer>
</main>
<!-- Aesthetic Decorative Elements -->
<div class="fixed -bottom-24 -left-24 w-96 h-96 bg-primary/5 rounded-full blur-[100px] pointer-events-none"></div>
<div class="fixed -top-24 -right-24 w-96 h-96 bg-tertiary/5 rounded-full blur-[100px] pointer-events-none"></div>
</body></html>
